name: Upstream QEMU CI

on:
  push:
  pull_request:
    branches:
      - devel

env:
  # p-b-o/qemu-ci is an upstream-series runner. This downstream tree carries
  # local board imports with cross-toolchain warnings, so keep Werror strictness
  # only for the source CI repository.
  QEMU_WERROR: ${{ github.repository == 'p-b-o/qemu-ci' && '--enable-werror' || '--disable-werror' }}
  # Build documentation once in build-misc. Other jobs validate compilers,
  # targets, or features and do not need duplicate Sphinx builds.
  QEMU_DOCS: --disable-docs
  # Full thorough functional coverage includes host-sensitive GPU/KVM cases.
  # Keep it in p-b-o/qemu-ci; downstream runs use quick functional smoke.
  QEMU_FUNC_SUITES: ${{ github.repository == 'p-b-o/qemu-ci' && '--suite func-quick --suite func-thorough' || '--suite func-quick' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkapply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # to debug container live from GitHub
      # - uses: mxschmitt/action-tmate@v3
      - run: bash -c '[ ! -f shazam.log ] || { cat shazam.log; exit 1; }'

  checkpatch:
    needs: checkapply
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: patch-range
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_REF_NAME: ${{ github.ref_name }}
          CURRENT_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [ "$REPOSITORY" = "p-b-o/qemu-ci" ]; then
              git remote add upstream https://gitlab.com/qemu-project/qemu
              git fetch --no-tags upstream master
              base="$(git merge-base upstream/master HEAD)"
              echo "range=$base..HEAD" >> "$GITHUB_OUTPUT"
              exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
              if [ -z "$BASE_REF" ] || [ -z "$PR_HEAD_SHA" ]; then
                  echo "::error::Missing pull request range metadata"
                  exit 1
              fi

              git fetch --no-tags origin "$BASE_REF"
              base="$(git merge-base "origin/$BASE_REF" "$PR_HEAD_SHA")"
              echo "range=$base..$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
              exit 0
          fi

          if [ "$EVENT_NAME" != "push" ] || [ -z "$PUSH_BEFORE_SHA" ]; then
              echo "::error::Missing push range metadata"
              exit 1
          fi

          zero_sha=0000000000000000000000000000000000000000
          if [ "$PUSH_BEFORE_SHA" != "$zero_sha" ] &&
             ! git cat-file -e "$PUSH_BEFORE_SHA^{commit}"; then
              git fetch --no-tags origin "$PUSH_BEFORE_SHA" || true
          fi

          if [ "$PUSH_BEFORE_SHA" = "$zero_sha" ] ||
             ! git cat-file -e "$PUSH_BEFORE_SHA^{commit}"; then
              if [ -z "$DEFAULT_BRANCH" ]; then
                  echo "::error::Missing default branch for rewritten push"
                  exit 1
              fi
              if [ "$PUSH_REF_NAME" = "$DEFAULT_BRANCH" ]; then
                  echo "::error::Cannot recover rewritten default branch base"
                  exit 1
              fi

              git fetch --no-tags origin "$DEFAULT_BRANCH"
              base="$(git merge-base "origin/$DEFAULT_BRANCH" "$CURRENT_SHA")"
          else
              base="$(git merge-base "$PUSH_BEFORE_SHA" "$CURRENT_SHA")"
          fi
          echo "range=$base..$CURRENT_SHA" >> "$GITHUB_OUTPUT"
      - run: >
          ./scripts/checkpatch.pl --no-strict
          "${{ steps.patch-range.outputs.range }}"

  # Use prebuilt images instead of rebuilding them in CI.
  build-cross:
    needs: checkapply
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        container: [alpine,centos9,debian-amd64-cross,debian-arm64-cross,debian-hexagon-cross,debian-loongarch-cross,debian-ppc64el-cross,debian-riscv64-cross,debian-tricore-cross,fedora,ubuntu2404]
    steps:
      - uses: actions/checkout@v6
      - run: pip install meson
      # - run: make docker-run J=$(nproc) RUNC=podman TEST=test-build IMAGE=docker.io/pboqemu/qemu-ci:${{matrix.container}}
      - run: >
          podman run --pull newer --init --rm -it -v $(pwd):$(pwd)
          -w $(pwd)/tests/docker/
          docker.io/pboqemu/qemu-ci:${{matrix.container}}
          env QEMU_SRC=$(pwd) QEMU_WERROR="${{ env.QEMU_WERROR }}" ENABLE_RUST=0 EXTRA_CONFIGURE_OPTS="${{ env.QEMU_DOCS }}" INSTALL_DIR=/ BUILD_DIR=/tmp MAKEFLAGS="-j $(nproc)"
          ./test-build

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            image: ubuntu-24.04
          - arch: aarch64
            image: ubuntu-24.04-arm
    needs: checkapply
    runs-on: ${{matrix.image}}
    steps:
      - run: sudo rm -rf /opt/ /usr/local/.ghcup /usr/local/lib/android
      - uses: actions/checkout@v6
      - run: >
          podman run --pull newer --init --rm -it -v $(pwd):$(pwd) -w $(pwd)
          docker.io/pboqemu/qemu-ci:debian
          bash -cx './configure ${{ env.QEMU_WERROR }} ${{ env.QEMU_DOCS }} &&
          ninja -C build install'
      - run: >
          podman run --pull newer --init --rm -it -v $(pwd):$(pwd) -w $(pwd)
          docker.io/pboqemu/qemu-ci:debian
          ./build/qemu-system-x86_64 -nographic -plugin ./build/contrib/plugins/libstoptrigger,icount=1000000 -plugin ./build/tests/tcg/plugins/libinsn -plugin ./build/contrib/plugins/libcpp -d plugin
      - run: >
          podman run --pull newer --init --rm -it -v $(pwd):$(pwd) -w $(pwd)
          docker.io/pboqemu/qemu-ci:debian
          ./build/qemu-${{matrix.arch}} -plugin ./build/contrib/plugins/libstoptrigger,icount=1000000  -plugin ./build/tests/tcg/plugins/libinsn -plugin ./build/contrib/plugins/libcpp -d plugin ./build/qemu-system-x86_64 --version

  build-cross-mingw64:
    needs: checkapply
    runs-on: ubuntu-24.04
    steps:
      - run: sudo rm -rf /opt/ /usr/local/.ghcup /usr/local/lib/android
      - uses: actions/checkout@v6
      - run: >
          podman run --pull newer --init --rm -it -v $(pwd):$(pwd) -w $(pwd)
          docker.io/pboqemu/qemu-ci:fedora-win64-cross
          bash -cx './configure ${{ env.QEMU_WERROR }} ${{ env.QEMU_DOCS }} $QEMU_CONFIGURE_OPTS && ninja -C build install'

  build-windows:
    needs: checkapply
    strategy:
      fail-fast: false
      matrix:
        include:
          - sys: UCRT64
            image: windows-2025
            arch: x64
          - sys: CLANG64
            image: windows-2025
            arch: x64
          - sys: MINGW64
            image: windows-2025
            arch: x64
          - sys: CLANGARM64
            image: windows-11-arm
            arch: arm64
    runs-on: ${{matrix.image}}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: ${{matrix.sys}}
      - uses: actions/checkout@v6
      - run: >
          pacman -S --noconfirm base-devel binutils bison curl diffutils flex git grep make sed
          ${MINGW_PACKAGE_PREFIX}-toolchain
          ${MINGW_PACKAGE_PREFIX}-glib2
          ${MINGW_PACKAGE_PREFIX}-gtk3
          ${MINGW_PACKAGE_PREFIX}-libnfs
          ${MINGW_PACKAGE_PREFIX}-libssh
          ${MINGW_PACKAGE_PREFIX}-ninja
          ${MINGW_PACKAGE_PREFIX}-pixman
          ${MINGW_PACKAGE_PREFIX}-pkgconf
          ${MINGW_PACKAGE_PREFIX}-python
          ${MINGW_PACKAGE_PREFIX}-SDL2
          ${MINGW_PACKAGE_PREFIX}-zstd
      # Install all dependencies for windows build
      - run: git clone https://github.com/msys2/MINGW-packages --depth=1
      - run: pushd ./MINGW-packages/mingw-w64-qemu && (makepkg --syncdeps --nobuild --noprepare --noconfirm --skippgpcheck PKGBUILD || true) && popd
      # Install debug tools (gflags, cdb), included in wdk:
      - run: /c/ProgramData/Chocolatey/bin/choco install -y windowsdriverkit11
      - run: ./configure ${{ env.QEMU_WERROR }} ${{ env.QEMU_DOCS }} && ninja -C build
      # detect dll issue by loading qemu binary with cdb (run + quit)
      # enable verbose load debug with gflags
      # https://ten0s.github.io/blog/2022/07/01/debugging-dll-loading-errors
      - run: /c/Program\ Files\ \(x86\)/Windows\ Kits/10/Debuggers/${{matrix.arch}}/gflags.exe -i qemu-system-x86_64.exe +sls
      - run: /c/Program\ Files\ \(x86\)/Windows\ Kits/10/Debuggers/${{matrix.arch}}/cdb.exe -c 'g;q' ./build/qemu-system-x86_64.exe --version || true
      - run: ./build/qemu-system-x86_64.exe -nographic -plugin ./build/contrib/plugins/libstoptrigger,icount=1000000 -plugin ./build/tests/tcg/plugins/libinsn -plugin ./build/contrib/plugins/libcpp -d plugin


  build-macos:
    needs: checkapply
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            image: macos-15-intel
          - arch: aarch64
            image: macos-26
    runs-on: ${{matrix.image}}
    steps:
      - uses: actions/checkout@v6
      - run: brew uninstall cmake # conflict with install command below
      - run: brew install --quiet $(env HOMEBREW_NO_ENV_HINTS=1 brew deps --include-build qemu) bison flex
      - run: |
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
      - run: ./configure ${{ env.QEMU_WERROR }} ${{ env.QEMU_DOCS }} && ninja -C build
      - run: ./build/qemu-system-x86_64-unsigned -nographic -plugin ./build/contrib/plugins/libstoptrigger,icount=1000000 -plugin ./build/tests/tcg/plugins/libinsn -plugin ./build/contrib/plugins/libcpp -d plugin

  build-mcs51-family-linux:
    needs: checkapply
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            image: ubuntu-24.04
          - arch: aarch64
            image: ubuntu-24.04-arm
    runs-on: ${{ matrix.image }}
    steps:
      - run: sudo rm -rf /opt/ /usr/local/.ghcup /usr/local/lib/android
      - uses: actions/checkout@v6
      - name: Build MCS-51 family targets
        run: >
          podman run --pull newer --init --rm -it
          -v "$(pwd):$(pwd)" -w "$(pwd)"
          docker.io/pboqemu/qemu-ci:debian
          bash -cx './configure ${{ env.QEMU_WERROR }} ${{ env.QEMU_DOCS }}
          --target-list=mcs51-softmmu,mcs251-softmmu && ninja -C build'
      - name: Run MCS-51 family tests
        run: >
          podman run --pull newer --init --rm -i
          -v "$(pwd):$(pwd)" -w "$(pwd)"
          docker.io/pboqemu/qemu-ci:debian
          bash -cx './build/pyvenv/bin/meson test -C build --no-rebuild
          --print-errorlogs qemu:qtest-mcs51/stc8g-test
          qemu:qtest-mcs251/stc32-test qemu:func-mcs51-isa
          qemu:func-mcs251-isa'

  build-mcs51-family-macos:
    needs: checkapply
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            image: macos-15-intel
          - arch: aarch64
            image: macos-26
    runs-on: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v6
      - run: brew uninstall cmake # conflict with install command below
      - run: |
          # shellcheck disable=SC2046
          brew install --quiet \
              $(env HOMEBREW_NO_ENV_HINTS=1 brew deps --include-build qemu) \
              bison flex
      - run: |
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
      - name: Build MCS-51 family targets
        run: >
          ./configure ${{ env.QEMU_WERROR }} ${{ env.QEMU_DOCS }}
          --target-list=mcs51-softmmu,mcs251-softmmu && ninja -C build
      - name: Run MCS-51 family tests
        run: >
          ./build/pyvenv/bin/meson test -C build --no-rebuild
          --print-errorlogs qemu:qtest-mcs51/stc8g-test
          qemu:qtest-mcs251/stc32-test qemu:func-mcs51-isa
          qemu:func-mcs251-isa

  build-mcs51-family-mingw:
    needs: checkapply
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MINGW64
      - uses: actions/checkout@v6
      - run: >
          pacman -S --noconfirm base-devel binutils bison curl diffutils
          flex git grep make sed ${MINGW_PACKAGE_PREFIX}-toolchain
          ${MINGW_PACKAGE_PREFIX}-glib2 ${MINGW_PACKAGE_PREFIX}-gtk3
          ${MINGW_PACKAGE_PREFIX}-libnfs ${MINGW_PACKAGE_PREFIX}-libssh
          ${MINGW_PACKAGE_PREFIX}-ninja ${MINGW_PACKAGE_PREFIX}-pixman
          ${MINGW_PACKAGE_PREFIX}-pkgconf ${MINGW_PACKAGE_PREFIX}-python
          ${MINGW_PACKAGE_PREFIX}-SDL2 ${MINGW_PACKAGE_PREFIX}-zstd
      - name: Build MCS-51 family targets
        run: >
          ./configure ${{ env.QEMU_WERROR }} ${{ env.QEMU_DOCS }}
          --target-list=mcs51-softmmu,mcs251-softmmu && ninja -C build
      - name: Run MCS-51 family qtests
        run: >
          ./build/pyvenv/bin/meson test -C build --no-rebuild
          --print-errorlogs qemu:qtest-mcs51/stc8g-test
          qemu:qtest-mcs251/stc32-test

  build-freebsd:
    needs: checkapply
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: vmactions/freebsd-vm@v1
        with:
          copyback: false
          release: "14.4"
      - run: rsync -av ./ freebsd:/home/qemu/
      - shell: freebsd {0}
        run: set -ex && pkg update && pkg install -y git gcc gmake python pkgconf pixman bison flex glib ninja
      - shell: freebsd {0}
        run: cd /home/qemu && ./configure ${{ env.QEMU_WERROR }} ${{ env.QEMU_DOCS }} && ninja -C build
      - shell: freebsd {0}
        run: cd /home/qemu && ./build/qemu-x86_64 -plugin ./build/contrib/plugins/libstoptrigger,icount=1000000  -plugin ./build/tests/tcg/plugins/libinsn -plugin ./build/contrib/plugins/libcpp -d plugin ./build/qemu-x86_64 --version
      - shell: freebsd {0}
        run: cd /home/qemu && ./build/qemu-system-x86_64 -nographic -plugin ./build/contrib/plugins/libstoptrigger,icount=1000000 -plugin ./build/tests/tcg/plugins/libinsn -plugin ./build/contrib/plugins/libcpp -d plugin

  build-openbsd:
    needs: checkapply
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: vmactions/openbsd-vm@v1
        with:
          copyback: false
          release: "7.8"
      # move root home to /home, which has all disk space
      - shell: openbsd {0}
        run: mv /root/ /home/ && ln -s /home/root/ /root
      - run: rsync -av ./ openbsd:/home/qemu/
      - shell: openbsd {0}
        run: set -ex && pkg_add dtc git pkgconf bzip2 xz ninja bash gmake gsed gettext-tools gnutls capstone sdl2 gtk+3 libxkbcommon zstd libslirp bison flex
      - shell: openbsd {0}
        run: cd /home/qemu && ./configure ${{ env.QEMU_WERROR }} ${{ env.QEMU_DOCS }} && ninja -C build
      # split-wx=on: https://gitlab.com/qemu-project/qemu/-/issues/2685
      - shell: openbsd {0}
        run: cd /home/qemu && ./build/qemu-system-x86_64 -accel tcg,split-wx=on -nographic -plugin ./build/contrib/plugins/libstoptrigger,icount=1000000 -plugin ./build/tests/tcg/plugins/libinsn -plugin ./build/contrib/plugins/libcpp -d plugin

  build-misc:
    needs: checkapply
    runs-on: ubuntu-24.04
    steps:
      - run: sudo rm -rf /opt/ /usr/local/.ghcup /usr/local/lib/android
      - uses: actions/checkout@v6
      # Sphinx maps -j auto to Python's CPU count; keep its workers serial.
      - run: >
          podman run --pull newer --init --rm -it -v $(pwd):$(pwd) -w $(pwd)
          docker.io/pboqemu/qemu-ci:debian
          bash -cx './configure ${{ env.QEMU_WERROR }} --disable-user --disable-system --enable-docs --enable-tools &&
          PYTHON_CPU_COUNT=1 ninja -C build sphinxdocs &&
          ninja -C build install'

  build-big-endian:
    needs: checkapply
    runs-on: ubuntu-24.04
    steps:
      - run: sudo rm -rf /opt/ /usr/local/.ghcup /usr/local/lib/android
      - uses: actions/checkout@v6
      - run: >
          podman run --pull newer --init --rm -it -v $(pwd):$(pwd) -w $(pwd)
          docker.io/pboqemu/qemu-ci:debian-s390x-cross
          bash -cx './configure ${{ env.QEMU_WERROR }} ${{ env.QEMU_DOCS }} $QEMU_CONFIGURE_OPTS && ninja -C build install'

  build-debug:
    needs: checkapply
    runs-on: ubuntu-24.04
    steps:
      - run: sudo rm -rf /opt/ /usr/local/.ghcup /usr/local/lib/android
      - uses: actions/checkout@v6
      - run: >
          podman run --pull newer --init --rm -it -v $(pwd):$(pwd) -w $(pwd)
          docker.io/pboqemu/qemu-ci:debian
          bash -cx './configure ${{ env.QEMU_WERROR }} ${{ env.QEMU_DOCS }} --enable-rust --enable-debug --enable-modules && ninja -C build install'
      - run: >
          podman run --pull newer --init --rm -it -v $(pwd):$(pwd) -w $(pwd)
          docker.io/pboqemu/qemu-ci:debian
          ./build/qemu-system-x86_64 -nographic -plugin ./build/contrib/plugins/libstoptrigger,icount=1000000 -plugin ./build/tests/tcg/plugins/libinsn -plugin ./build/contrib/plugins/libcpp -d plugin

  build-static:
    needs: checkapply
    runs-on: ubuntu-24.04
    steps:
      - run: sudo rm -rf /opt/ /usr/local/.ghcup /usr/local/lib/android
      - uses: actions/checkout@v6
      - run: >
          podman run --pull newer --init --rm -it -v $(pwd):$(pwd) -w $(pwd)
          docker.io/pboqemu/qemu-ci:debian
          bash -cx './configure ${{ env.QEMU_WERROR }} ${{ env.QEMU_DOCS }} --disable-system --disable-tools --disable-guest-agent --static && ninja -C build install'

  build-tsan:
    needs: checkapply
    runs-on: ubuntu-24.04
    steps:
      - run: sudo rm -rf /opt/ /usr/local/.ghcup /usr/local/lib/android
      - uses: actions/checkout@v6
      - run: >
          podman run --pull newer --init --rm -it -v $(pwd):$(pwd) -w $(pwd)
          docker.io/pboqemu/qemu-ci:debian
          bash -cx './configure ${{ env.QEMU_WERROR }} ${{ env.QEMU_DOCS }} --enable-tsan && ninja -C build install'

  build-clang:
    needs: checkapply
    runs-on: ubuntu-24.04
    steps:
      - run: sudo rm -rf /opt/ /usr/local/.ghcup /usr/local/lib/android
      - uses: actions/checkout@v6
      - run: >
          podman run --pull newer --init --rm -it -v $(pwd):$(pwd) -w $(pwd)
          docker.io/pboqemu/qemu-ci:debian
          bash -cx './configure ${{ env.QEMU_WERROR }} ${{ env.QEMU_DOCS }} --cxx=clang++ --cc=clang --host-cc=clang --enable-debug && ninja -C build install'

  build-clang-22:
    needs: checkapply
    runs-on: ubuntu-24.04
    steps:
      - run: sudo rm -rf /opt/ /usr/local/.ghcup /usr/local/lib/android
      - uses: actions/checkout@v6
      # bypass package signature check by faking sqv binary
      # Documentation is covered elsewhere; keep this a compiler-only build.
      - run: >
          podman run --pull newer --init --rm -it -v $(pwd):$(pwd) -w $(pwd)
          docker.io/pboqemu/qemu-ci:debian
          bash -cx 'cp /usr/bin/echo /usr/bin/sqv && LLVM_VERSION=22 && apt update && apt install -y lsb-release wget gnupg && wget https://apt.llvm.org/llvm.sh && bash llvm.sh ${LLVM_VERSION} && ./configure ${{ env.QEMU_WERROR }} ${{ env.QEMU_DOCS }} --cxx=clang++-${LLVM_VERSION} --cc=clang-${LLVM_VERSION} --host-cc=clang-${LLVM_VERSION} --enable-debug && ninja -C build install'

  build-kvm-only:
    needs: checkapply
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64, ppc64el, s390x]
    runs-on: ubuntu-24.04
    steps:
      - run: sudo rm -rf /opt/ /usr/local/.ghcup /usr/local/lib/android
      - uses: actions/checkout@v6
      - run: >
          podman run --pull newer --init --rm -it -v $(pwd):$(pwd) -w $(pwd)
          docker.io/pboqemu/qemu-ci:debian-${{matrix.arch}}-cross
          bash -cx './configure ${{ env.QEMU_WERROR }} ${{ env.QEMU_DOCS }} --disable-tcg $QEMU_CONFIGURE_OPTS && ninja -C build install'

  build-minimal:
    needs: checkapply
    runs-on: ubuntu-24.04
    steps:
      - run: sudo rm -rf /opt/ /usr/local/.ghcup /usr/local/lib/android
      - uses: actions/checkout@v6
      - run: >
          podman run --pull newer --init --rm -it -v $(pwd):$(pwd) -w $(pwd)
          docker.io/pboqemu/qemu-ci:debian
          bash -cx './configure ${{ env.QEMU_WERROR }} ${{ env.QEMU_DOCS }} --without-default-features --without-default-devices --disable-kvm --disable-tcg && ninja -C build install'

  build-oss-fuzz:
    needs: checkapply
    runs-on: ubuntu-24.04
    steps:
      - run: sudo rm -rf /opt/ /usr/local/.ghcup /usr/local/lib/android
      - uses: actions/checkout@v6
      - run: >
          podman run --pull newer --init --rm -it -v $(pwd):$(pwd) -w $(pwd)
          docker.io/pboqemu/qemu-ci:debian
          bash -cx 'mkdir build-oss-fuzz && export LSAN_OPTIONS=suppressions=scripts/lsan_suppressions.txt && CC="clang" CXX="clang++" CFLAGS="-fsanitize=address" ./scripts/oss-fuzz/build.sh'
      - run: >
          podman run --pull newer --init --rm -it -v $(pwd):$(pwd) -w $(pwd)
          docker.io/pboqemu/qemu-ci:debian
          bash -cx 'for fuzzer in $(find ./build-oss-fuzz/DEST_DIR/ -executable -type f); do grep "LLVMFuzzerTestOneInput" ${fuzzer} >& /dev/null || continue; env ASAN_OPTIONS="fast_unwind_on_malloc=0" ${fuzzer} -runs=1 -seed=1 || exit 1; done'

  check-tcg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            image: ubuntu-24.04
          - arch: aarch64
            image: ubuntu-24.04-arm
    needs: checkapply
    runs-on: ${{matrix.image}}
    steps:
      - run: sudo rm -rf /opt/ /usr/local/.ghcup /usr/local/lib/android
      - uses: actions/checkout@v6
      - run: >
          podman run --pull newer --init --rm -it -v $(pwd):$(pwd) -w $(pwd)
          docker.io/pboqemu/qemu-ci:debian
          bash -cx './configure ${{ env.QEMU_WERROR }} ${{ env.QEMU_DOCS }} --enable-rust --enable-debug-tcg --enable-debug-graph-lock --enable-debug-mutex && ninja -C build'
      - run: >
          podman run --pull newer --init --privileged --rm -it -v $(pwd):$(pwd) -w $(pwd)
          docker.io/pboqemu/qemu-ci:debian
          bash -cx "make -j1 check-tcg V=1"

  # run all meson tests, except functional.
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            image: ubuntu-24.04
            test_options: ""
          - arch: aarch64
            image: ubuntu-24.04-arm
            test_options: "-j 2"
    needs: checkapply
    runs-on: ${{matrix.image}}
    steps:
      - run: sudo rm -rf /opt/ /usr/local/.ghcup /usr/local/lib/android
      - uses: actions/checkout@v6
      # we use image with download cache filled. Solves servers flakiness.
      - run: >
          podman run --pull newer --init --rm -it -v $(pwd):$(pwd) -w $(pwd)
          docker.io/pboqemu/qemu-ci:debian
          bash -cx './configure ${{ env.QEMU_WERROR }} ${{ env.QEMU_DOCS }} --enable-rust --enable-debug-tcg --enable-debug-graph-lock --enable-debug-mutex && ninja -C build'
      - run: bash -c "[ -e /dev/kvm ] && sudo chown $USER:$USER /dev/kvm || true"
      # run podman without -t to avoid interactive output of meson test
      - run: >
          podman run --pull newer --init --privileged --rm -i $([ -e /dev/kvm ] && echo '-v /dev/kvm:/dev/kvm') -v $(pwd):$(pwd) -w $(pwd)
          docker.io/pboqemu/qemu-ci:debian
          bash -cx "./build/pyvenv/bin/meson test -C build
          --setup thorough
          --no-suite func-quick --no-suite func-thorough
          --no-suite block-slow --no-suite block-thorough
          ${{ matrix.test_options }} -t 5 --print-errorlogs"

  check-functional:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            image: ubuntu-24.04
          - arch: aarch64
            image: ubuntu-24.04-arm
    needs: checkapply
    runs-on: ${{matrix.image}}
    steps:
      - run: sudo rm -rf /opt/ /usr/local/.ghcup /usr/local/lib/android
      - uses: actions/checkout@v6
      # we use image with download cache filled. Solves servers flakiness.
      - run: >
          podman run --pull newer --init --rm -it -v $(pwd):$(pwd) -w $(pwd)
          docker.io/pboqemu/qemu-ci:debian
          bash -cx './configure ${{ env.QEMU_WERROR }} ${{ env.QEMU_DOCS }} --enable-rust --enable-debug-tcg --enable-debug-graph-lock --enable-debug-mutex && ninja -C build'
      - run: bash -c "[ -e /dev/kvm ] && sudo chown $USER:$USER /dev/kvm || true"
      # run podman without -t to avoid interactive output of meson test
      - run: >
          podman run --pull newer --init --privileged --rm -i $([ -e /dev/kvm ] && echo '-v /dev/kvm:/dev/kvm') -v $(pwd):$(pwd) -w $(pwd)
          docker.io/pboqemu/qemu-ci:debian
          bash -cx "./build/pyvenv/bin/meson test -C build --setup thorough ${{ env.QEMU_FUNC_SUITES }} -j1 --timeout-multiplier 0 --print-errorlogs --wrapper $(pwd)/scripts/run-functional-test.sh --max-lines=0"
          # Run with -j1 to avoid issues with parallel runs

  check-functional-rk3588-zvm:
    needs: checkapply
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - run: sudo rm -rf /opt/ /usr/local/.ghcup /usr/local/lib/android
      - uses: actions/checkout@v6
      - uses: actions/cache@v4
        with:
          path: .cache/qemu-test/download
          key: zvm-rk3588-assets-v1
      - run: >
          podman run --pull newer --init --rm -it -v $(pwd):$(pwd) -w $(pwd)
          docker.io/pboqemu/qemu-ci:debian
          bash -cx './configure ${{ env.QEMU_WERROR }} ${{ env.QEMU_DOCS }} --target-list=aarch64-softmmu && ninja -C build qemu-system-aarch64 qemu-img'
      - run: |
          podman run --pull newer --init --privileged --rm -i \
              -v $(pwd):$(pwd) -w $(pwd) \
              docker.io/pboqemu/qemu-ci:debian \
              bash -exc '
          missing=0
          for cmd in curl zstd mkfs.vfat mcopy; do
              command -v "$cmd" >/dev/null || missing=1
          done
          command -v 7z >/dev/null || command -v 7zz >/dev/null || missing=1
          if [ "$missing" -ne 0 ]; then
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                  --no-install-recommends curl dosfstools mtools zstd
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                  --no-install-recommends 7zip || \
                  DEBIAN_FRONTEND=noninteractive apt-get install -y \
                  --no-install-recommends p7zip-full
          fi

          cache_root=$(pwd)/.cache/qemu-test
          cache_dir=$cache_root/download
          mkdir -p "$cache_dir"

          run_test()
          {
              timeout=$1
              test_name=$2

              QEMU_TEST_CACHE_DIR=$cache_root \
              QEMU_FUNCTIONAL_TEST_TIMEOUT=$timeout \
              ./build/pyvenv/bin/meson test -C build --setup thorough \
                  -j1 --timeout-multiplier 0 --print-errorlogs \
                  --wrapper $(pwd)/scripts/run-functional-test.sh \
                  --max-lines=0 "$test_name"
          }

          download_asset()
          {
              url=$1
              sha=$2
              dest=$cache_dir/$sha
              tmp=$dest.tmp

              if [ -f "$dest" ] &&
                 printf "%s  %s\n" "$sha" "$dest" | sha256sum -c -
              then
                  return 0
              fi

              rm -f "$dest" "$tmp"
              curl -fL --retry 5 --retry-all-errors \
                  --connect-timeout 30 --speed-time 120 --speed-limit 1024 \
                  -o "$tmp" "$url"
              printf "%s  %s\n" "$sha" "$tmp" | sha256sum -c -
              mv "$tmp" "$dest"
          }

          run_test 15m qemu:func-aarch64-rk3588_zvm

          download_asset \
              https://esnl.hnu.edu.cn/zvm/resource/kernel_images.zip \
              05aa22b772808abef7082d3dfc513ea75b0813f3e0d4f028ad595e2c86fe3ec7 &
          pids=$!
          download_asset \
              https://esnl.hnu.edu.cn/zvm/resource/file_system_images_part1.zip \
              9a1840d8d486b2de8e8bedc1647cd3c5aa2f622111b45bb9f0d8e1d26b07c5f0 &
          pids="$pids $!"
          download_asset \
              https://esnl.hnu.edu.cn/zvm/resource/file_system_images_part2.zip \
              17b048b0a473dcbd4e5b7f1c5d4f50547ffefe3e040c0b8835e55cba7f45b823 &
          pids="$pids $!"

          status=0
          for pid in $pids; do
              wait "$pid" || status=1
          done
          if [ "$status" -ne 0 ]; then
              exit "$status"
          fi

          run_test 90m qemu:func-aarch64-rk3588_zvm_linux_guest
          '
